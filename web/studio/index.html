<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BAR AI Studio</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/session.js"></script>
  <script defer src="/config.js"></script>
  <script defer src="/scripts.js"></script>
  <script defer src="/openings.js"></script>
  <script defer src="/studio.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="BAR AI Studio home">
        <span class="brand-mark">B<span>✦</span></span>
        <span>BAR AI <strong>STUDIO</strong><small>STRATEGY WORKSHOP</small></span>
      </a>
      <div class="side-label">YOUR WORKSPACE</div>
      <label class="side-field">AI project <select id="project" aria-label="AI project"></select></label>
      <label class="side-field">Profile <select id="profile" aria-label="Profile"></select></label>
      <button id="new-project" class="side-action">＋ New AI from BAR</button>
      <button id="clone" class="side-action">＋ Duplicate profile</button>
      <button id="manage-project" class="side-action">Manage projects &amp; profiles</button>
      <nav id="navigation" aria-label="Workshop sections">
        <div class="side-label nav-label">MANAGE</div>
        <button data-page="manage"><span>⇄</span> AI install / remove</button>
        <div class="side-label nav-label">DESIGN</div>
        <button data-page="overview"><span>◫</span> Overview</button>
        <button data-page="opening"><span>◷</span> Opening</button>
        <button data-page="production"><span>▦</span> Production</button>
        <button data-page="economy"><span>◈</span> Economy</button>
        <button data-page="defense"><span>◇</span> Defense</button>
        <button data-page="combat"><span>⌁</span> Combat &amp; response</button>
        <button data-page="units"><span>⬡</span> Unit behavior</button>
        <button data-page="placement"><span>▧</span> Building placement</button>
        <button data-page="advanced"><span>⚙</span> All files</button>
        <button data-page="match"><span>▶</span> Test match</button>
      </nav>
      <div class="sidebar-foot">
        <span class="dot"></span> LOCAL WORKSPACE
        <p>Your files stay on this computer.</p>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><span class="crumb">WORKSPACE</span><span class="crumb-sep">/</span><span id="breadcrumb">Overview</span></div>
        <div class="top-actions">
          <span id="save-status" class="save-status">No project loaded</span>
          <span id="install-status" class="install-badge" hidden></span>
          <button id="reload" class="button subtle">Reload</button>
          <button id="undo" class="button subtle">Undo</button>
          <button id="review" class="button subtle">Review changes</button>
          <button id="project-history" class="button subtle">Project history</button>
          <button id="save-install" class="button subtle">Save &amp; install</button>
          <button id="save" class="button primary">Save changes</button>
        </div>
      </header>
      <div class="main-scroll">
        <div id="message" class="message" role="status" hidden></div>
        <div id="content" class="content" aria-live="polite"></div>
      </div>
    </main>
  </div>
  <dialog id="dialog">
    <div class="dialog-inner">
      <div class="dialog-heading"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="Close">×</button></div>
      <div id="dialog-content"></div>
    </div>
  </dialog>
</body>
</html>
