name: Windows tests

on: [push, pull_request]

jobs:
  studio:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-mcp.txt
      - run: python -m unittest discover -s tests
      - run: node --test 'tests/*.test.js'
      - run: npm install --no-save --no-package-lock playwright@1.61.1
      - run: npx playwright install chromium
      - run: node --test tests/studio.browser.cjs
